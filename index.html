<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-dark: #1d1815;
    --bege: #e8e0d0;
    --nude: #d4a896;
    --nude-soft: #e5c5b3;
    --nude-deep: #b8826a;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Montserrat', -apple-system, sans-serif;
    --brand: 'Cinzel', 'Playfair Display', Georgia, serif;
    --script: 'Great Vibes', 'Playfair Display', cursive;
    --exp-azul: #0f3f55;
    --exp-ouro: #fbb03c;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg-dark);
    color: var(--bege);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* ===== Divisão ===== */
  .split {
    display: flex;
    height: 100vh;
    height: 100svh;
    width: 100%;
  }
  .lado {
    position: relative;
    flex: 1 1 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    transition: flex-grow 0.7s cubic-bezier(.2,.7,.2,1);
    isolation: isolate;
  }
  .lado + .lado { border-left: 1px solid rgba(240, 178, 62, 0.35); }

  .lado .foto {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    transform: scale(1.04);
    transition: transform 1.2s cubic-bezier(.2,.7,.2,1), filter 0.7s;
    z-index: -2;
  }
  .lado.congresso .foto { background-image: url("photos/congresso-palco.jpg"); }
  .lado.experience .foto { background-image: url("photos/experience-nanii-piscina.jpg"); }
  .lado::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(29,24,21,0.55) 0%, rgba(29,24,21,0.62) 60%, rgba(29,24,21,0.82) 100%);
    z-index: -1;
  }
  .lado.experience::before {
    background: radial-gradient(ellipse at center, rgba(10,45,62,0.55) 0%, rgba(10,45,62,0.72) 70%, rgba(10,45,62,0.88) 100%);
  }

  .conteudo {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px 32px;
  }

  /* Logo oficial do Congresso (o PNG tem margem transparente em volta) */
  /* As duas logos ficam em caixas do mesmo tamanho, para que
     informações e botões fiquem na mesma altura nas duas metades */
  .logo-area {
    --lw: clamp(300px, 30vw, 460px);
    width: var(--lw);
    height: calc(var(--lw) / 1.2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-area img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    filter: drop-shadow(0 2px 18px rgba(0,0,0,0.45));
  }
  .info {
    margin-top: 26px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--nude);
    text-shadow: 0 1px 10px rgba(0,0,0,0.6);
  }
  .info span { display: block; margin-top: 6px; color: var(--bege); font-weight: 500; letter-spacing: 2px; }
  .lado.experience .info { color: var(--exp-ouro); }

  .botao {
    display: inline-block;
    margin-top: 28px;
    padding: 15px 30px;
    border: 1px solid var(--nude);
    color: var(--bege);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    transition: background 0.35s, color 0.35s, border-color 0.35s;
  }
  .lado.congresso:hover .botao,
  .lado.congresso:focus-visible .botao { background: var(--nude); color: var(--bg-dark); }
  .lado.experience .botao { border-color: var(--exp-ouro); }
  .lado.experience:hover .botao,
  .lado.experience:focus-visible .botao { background: var(--exp-ouro); color: #0a2d3e; }
  .lado:focus-visible { outline: 2px solid var(--nude); outline-offset: -6px; }

  /* Desktop: o lado escolhido cresce e o outro escurece */
  @media (hover: hover) and (min-width: 901px) {
    .split:hover .lado { flex-grow: 0.8; }
    .split:hover .lado:hover { flex-grow: 1.2; }
    .lado:hover .foto { transform: scale(1.0); }
    .split:hover .lado:not(:hover) .foto { filter: grayscale(0.6) brightness(0.6); }
  }

  /* ===== Mobile: uma metade em cima da outra ===== */
  @media (max-width: 900px) {
    .split { flex-direction: column; }
    .lado + .lado { border-left: none; border-top: 1px solid rgba(240, 178, 62, 0.35); }
    .conteudo { padding: 20px 24px; }
    .logo-area { --lw: min(72vw, 32svh); }
    .info { margin-top: 12px; font-size: 9.5px; letter-spacing: 2px; }
    .info span { margin-top: 3px; letter-spacing: 1.5px; }
    .botao { margin-top: 14px; padding: 11px 20px; font-size: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .lado, .lado .foto { transition: none; }
  }
  .visualmente-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }</style>
</head>
<body>

<main class="split">
  <h1 class="visualmente-oculto">Luxo de Festa, por César Serra: Congresso Nacional de Festas &amp; Eventos e Luxo de Festa Experience</h1>
  <a class="lado congresso" href="congresso.html">
    <div class="foto" role="img" aria-label="Salão do Congresso Luxo de Festa"></div>
    <div class="conteudo">
      <h2 class="logo-area"><img src="logos/logo_congresso_branca_recorte.png" alt="Luxo de Festa — Congresso Nacional de Festas &amp; Eventos"></h2>
      <p class="info">4ª edição · 8, 9 e 10 de novembro de 2027<span>Unique Palace · Brasília/DF</span></p>
      <span class="botao">Conhecer o Congresso</span>

  <a class="lado experience" href="experience.html">

      <h2 class="logo-area"><img src="logos/logo_experience_branco_amarelo.svg" alt="Luxo de Festa Experience"></h2>

      <span class="botao">Conhecer o Experience</span>
    </div>
  </a>
</main>
